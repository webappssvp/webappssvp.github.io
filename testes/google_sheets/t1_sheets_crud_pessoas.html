<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Pessoas - CRUD Planilha</title>
  <!-- Link para o CSS Externo básico -->
  <link rel="stylesheet" href="../testes.css">
  <!-- Fonte Inter para tipografia premium -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Estilos locais complementares para o CRUD */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      width: 100%;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ssvp-navy);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      width: 100%;
      padding: 0 12px;
      border: 1px solid var(--ssvp-gray-border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--ssvp-text-main);
      background-color: var(--ssvp-white);
      height: var(--input-height, 40px);
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus {
      border-color: var(--ssvp-blue);
    }

    form.modo-edicao {
      background-color: #f0f7ff;
      border: 2px solid var(--ssvp-blue);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      transition: all 0.25s ease;
    }

    form.modo-edicao #btnSubmit {
      background-color: var(--ssvp-success);
    }

    form.modo-edicao #btnSubmit:hover {
      background-color: #0f9f6e;
    }

    .actions-btn {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      width: 100%;
    }

    .actions-btn button {
      flex: 1;
      min-width: 130px;
      height: var(--input-height, 44px);
    }

    button {
      padding: 0 var(--btn-padding, 18px);
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      color: white;
      background-color: var(--ssvp-blue);
      transition: background-color 0.2s, transform 0.1s;
      outline: none;
      height: var(--input-height, 44px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button:hover {
      background-color: #0066cc;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background-color: var(--ssvp-text-muted);
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #f59e0b;
      /* Amarelo Ouro Acessível */
      color: var(--ssvp-navy);
    }

    .btn-secondary:hover {
      background-color: #d97706;
    }

    .btn-delete {
      background-color: var(--ssvp-red);
    }

    .btn-delete:hover {
      background-color: #b91c1c;
    }

    .linha-selecionavel {
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .linha-selecionavel:hover {
      background-color: var(--ssvp-light-blue);
    }

    .linha-selecionavel.selecionada {
      background-color: #cce3ff !important;
      outline: 2px solid var(--ssvp-blue);
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ssvp-navy);
      margin: 28px 0 12px 0;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--ssvp-gray-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Tabela Responsiva com rolagem lateral no mobile */
    .tabela-responsiva {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--ssvp-gray-border);
      border-radius: 8px;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 500px;
      /* Garante estrutura legível na rolagem lateral */
    }

    th,
    td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid var(--ssvp-gray-border);
      font-size: var(--table-font-size, 14px);
    }

    th {
      background-color: var(--ssvp-light-blue);
      color: var(--ssvp-navy);
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background-color: var(--ssvp-gray-light);
    }

    .status-msg {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .status-msg.sucesso {
      background-color: #c6f6d5;
      color: #22543d;
      display: block;
    }

    .status-msg.erro {
      background-color: #fed7d7;
      color: #742a2a;
      display: block;
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: var(--ssvp-text-muted);
      font-style: italic;
    }
  </style>
</head>

<body>

  <!-- Área dedicada para o Teste Específico (CRUD Planilha) -->
  <main class="teste-container">

    <!-- Formulário de Cadastro -->
    <form id="personForm">
      <input type="hidden" id="personId" value="">

      <div class="grid-3">
        <div class="form-group">
          <label for="nome" class="form-label">Nome</label>
          <input type="text" id="nome" required placeholder="Ex: Maria Silva">
        </div>
        <div class="form-group">
          <label for="telefone" class="form-label">Telefone</label>
          <input type="tel" id="telefone" required placeholder="Ex: (11) 99999-8888">
        </div>
        <div class="form-group">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" id="email" required placeholder="Ex: maria@email.com">
        </div>
      </div>

      <div class="actions-btn">
        <button type="submit" id="btnSubmit">Cadastrar Pessoa</button>
        <button type="button" id="btnDelete" class="btn-delete" style="display: none;">Excluir Registro</button>
        <button type="button" id="btnCancel" class="btn-secondary" style="display: none;">Cancelar Edição</button>
      </div>
    </form>

    <div id="statusMsg" class="status-msg"></div>

    <!-- Tabela de Cadastrados -->
    <div class="section-title">
      <span>Pessoas Cadastradas:</span>
      <button type="button" id="btnRefresh" class="btn-secondary">Atualizar Lista</button>
    </div>

    <div class="tabela-responsiva">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>E-mail</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="4" class="empty-state">Carregando dados...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <!-- Script dos Testes -->
  <script src="../testes.js"></script>
  <script>
    // Inicializa a Sandbox
    inicializarSandbox({
      id_teste: "sheets_crud_pessoas",
      titulo: "Google Sheets - CRUD Pessoas no webapp",
      versao: "teste v2.1",
      instrucoes: [
        "Este teste se conecta à API real do Google Sheets para ler, gravar, editar e remover pessoas em tempo real.",
        "Para cadastrar uma nova pessoa, preencha o formulário e clique em 'Cadastrar'.",
        "Para EDITAR ou EXCLUIR, basta tocar na linha desejada na tabela. O formulário entrará em Modo Edição com botões grandes de Salvar, Excluir e Cancelar.",
        "Calibre os sliders do sandbox acima para ajustar as dimensões dos inputs, botões do formulário e tamanho da fonte da tabela."
      ],
      controles: [
        { variavel: "--btn-padding", label: "Padding lateral Botões", tipo: "range", min: 6, max: 24, padrao: 18, unit: "px" },
        { variavel: "--input-height", label: "Altura de Inputs/Botões", tipo: "range", min: 36, max: 64, padrao: 44, unit: "px" },
        { variavel: "--table-font-size", label: "Tamanho da Letra Tabela", tipo: "range", min: 11, max: 20, padrao: 14, unit: "px" }
      ]
    });

    // API real do Google Apps Script de Produção para o CRUD de Pessoas

    const URL_API = "https://script.google.com/macros/s/AKfycbzCb6_U5FHSRztf3Twrqr-6qGec7La4t1paGb7qIpmk1ZzICVQWVvxLZ_9KrzJWk0z5/exec";

    const form = document.getElementById('personForm');
    const personIdInput = document.getElementById('personId');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnCancel = document.getElementById('btnCancel');
    const btnDelete = document.getElementById('btnDelete');
    const btnRefresh = document.getElementById('btnRefresh');
    const tableBody = document.getElementById('tableBody');
    const statusMsg = document.getElementById('statusMsg');

    let listData = []; // Armazena a lista atual em memória para facilitar edição

    function showStatus(text, isError = false) {
      statusMsg.innerText = text;
      statusMsg.className = `status-msg ${isError ? 'erro' : 'sucesso'}`;
      setTimeout(() => { statusMsg.className = 'status-msg'; }, 5000);
    }

    // Carregar Dados (GET)
    async function loadData() {
      tableBody.innerHTML = '<tr><td colspan="3" class="empty-state">Carregando dados...</td></tr>';
      try {
        const response = await fetch(URL_API, { redirect: 'follow' });
        const res = await response.json();

        if (res.status === 'success') {
          listData = res.data;
          renderTable(listData);
        } else {
          showStatus('Erro ao carregar dados: ' + res.message, true);
        }
      } catch (err) {
        showStatus('Erro de conexão/CORS: ' + err.message, true);
      }
    }

    // Renderizar Tabela
    function renderTable(data) {
      if (!data || data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="3" class="empty-state">Nenhuma pessoa cadastrada.</td></tr>';
        return;
      }

      tableBody.innerHTML = '';
      data.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'linha-selecionavel';
        tr.setAttribute('data-id', item.id);
        tr.innerHTML = `
          <td>${item.nome || ''}</td>
          <td>${item.telefone || ''}</td>
          <td>${item.email || ''}</td>
        `;
        tr.addEventListener('click', () => setupEdit(item.id));
        tableBody.appendChild(tr);
      });
    }

    // Preencher formulário para Edição
    window.setupEdit = function (id) {
      const item = listData.find(p => String(p.id) === String(id));
      if (!item) return;

      // Realça a linha selecionada
      const allRows = tableBody.querySelectorAll('.linha-selecionavel');
      allRows.forEach(r => r.classList.remove('selecionada'));
      const selectedRow = tableBody.querySelector(`[data-id="${id}"]`);
      if (selectedRow) selectedRow.classList.add('selecionada');

      personIdInput.value = item.id;
      document.getElementById('nome').value = item.nome;
      document.getElementById('telefone').value = item.telefone;
      document.getElementById('email').value = item.email;

      // Ativa o visual de edição no formulário
      form.classList.add('modo-edicao');
      btnSubmit.innerText = 'Salvar Alterações';
      btnCancel.style.display = 'inline-block';
      btnDelete.style.display = 'inline-block';
    };

    // Resetar Formulário
    function resetForm() {
      personIdInput.value = '';
      form.reset();
      form.classList.remove('modo-edicao');

      // Limpa seleções da tabela
      const allRows = tableBody.querySelectorAll('.linha-selecionavel');
      allRows.forEach(r => r.classList.remove('selecionada'));

      btnSubmit.innerText = 'Cadastrar Pessoa';
      btnCancel.style.display = 'none';
      btnDelete.style.display = 'none';
    }

    btnCancel.addEventListener('click', resetForm);

    // Submeter (Criar ou Atualizar)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = personIdInput.value;
      const isUpdate = Boolean(id);

      const payload = {
        action: isUpdate ? 'update' : 'create',
        id: id,
        nome: document.getElementById('nome').value,
        telefone: document.getElementById('telefone').value,
        email: document.getElementById('email').value
      };

      btnSubmit.disabled = true;
      btnSubmit.innerText = isUpdate ? 'Salvando...' : 'Cadastrando...';

      try {
        const response = await fetch(URL_API, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const res = await response.json();

        if (res.status === 'success') {
          showStatus(res.message);
          resetForm();
          loadData();
        } else {
          showStatus('Erro: ' + res.message, true);
        }
      } catch (err) {
        showStatus('Erro ao enviar dados: ' + err.message, true);
      } finally {
        btnSubmit.disabled = false;
        if (!personIdInput.value) btnSubmit.innerText = 'Cadastrar Pessoa';
      }
    });

    // Excluir Pessoa via botão do formulário
    btnDelete.addEventListener('click', async () => {
      const id = personIdInput.value;
      if (!id) return;

      if (!confirm('Tem certeza que deseja excluir permanentemente esta pessoa?')) return;

      btnDelete.disabled = true;
      btnDelete.innerText = 'Excluindo...';

      try {
        const response = await fetch(URL_API, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete', id: id })
        });

        const res = await response.json();

        if (res.status === 'success') {
          showStatus(res.message);
          resetForm();
          loadData();
        } else {
          showStatus('Erro ao excluir: ' + res.message, true);
        }
      } catch (err) {
        showStatus('Erro ao excluir: ' + err.message, true);
      } finally {
        btnDelete.disabled = false;
        btnDelete.innerText = 'Excluir Registro';
      }
    });

    btnRefresh.addEventListener('click', loadData);

    // Carregar dados assim que abrir a página
    loadData();
  </script>
</body>

</html>
